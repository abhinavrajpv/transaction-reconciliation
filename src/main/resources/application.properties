
spring.application.name=Transaction_Reconciliation_BatchProcessor

# PostgreSQL database
spring.datasource.url=jdbc:postgresql://localhost:5432/transaction_reconciliation
spring.datasource.username=postgres
spring.datasource.password=CredAi@abhinav
spring.datasource.driver-class-name=org.postgresql.Driver

# Create/update application tables from JPA entities during development
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Spring Batch metadata tables
spring.batch.jdbc.initialize-schema=always
spring.batch.job.enabled=false

# Input files
reconciliation.first-file=C:/batch/input/input_transactions.csv
reconciliation.second-file=C:/batch/input/latest_transactions.csv
#reconciliation.first-file=C:/batch/input/first_transactions.csv
#reconciliation.second-file=C:/batch/input/second_transactions6.csv

# File validation
reconciliation.max-file-size=5242880

# First CSV headers — order matters
reconciliation.first-file.headers=transaction_id,account_number,transaction_date,amount,currency,transaction_type,description

# Batch processing
reconciliation.chunk-size=1000
reconciliation.processor.core-pool-size=4
reconciliation.processor.max-pool-size=4
reconciliation.processor.queue-capacity=1000

# Results CSV
#reconciliation.results-file=C:/batch/output/reconciliation-results.csv
reconciliation.results-file=C:/batch/output/sample-results.csv
